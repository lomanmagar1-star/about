
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: white;
      font-family: Arial, sans-serif;
    }

    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
    }

    .about-button {
      grid-column: 2;
      justify-self: center;
      background: none;
      border: none;
      padding: 0;
      color: black;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="bottom-nav">
    <button class="about-button">About</button>
  </nav>

</body>
</html>
