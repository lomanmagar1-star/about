
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .scroll-space {
      height: 600vh;
    }

    .about-button {
      position: fixed;
      top: calc(100vh - 45px);
      left: calc(37.5% - 25px);
      transform: translateX(-50%);
      background: none;
      border: none;
      padding: 0;
      color: black;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }

    /* Figure stays on the left */
    .stick-figure {
      position: fixed;
      top: 25vh;
      left: 5%;
      width: 35vw;
      height: 50vh;
      pointer-events: none;
    }

    .stick-figure svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .figure-line {
      fill: none;
      stroke: black;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .head {
      fill: none;
      stroke: black;
      stroke-width: 5;
    }
  </style>
</head>

<body>

  <button class="about-button" id="about">
    About
  </button>

  <div class="stick-figure">
    <svg viewBox="0 0 200 400"
         xmlns="http://www.w3.org/2000/svg">

      <!-- Legs grow from feet to hips -->
      <path id="leftLeg"
            class="figure-line"
            d="M40 380 L100 245"/>

      <path id="rightLeg"
            class="figure-line"
            d="M160 380 L100 245"/>

      <!-- Body grows upwards -->
      <path id="bodyLine"
            class="figure-line"
            d="M100 245 L100 95"/>

      <!-- Arms branch out from body -->
      <path id="leftArm"
            class="figure-line"
            d="M100 140 L30 220"/>

      <path id="rightArm"
            class="figure-line"
            d="M100 140 L170 220"/>

      <!-- Head grows last -->
      <circle id="head"
              class="head"
              cx="100"
              cy="55"
              r="40"/>
    </svg>
  </div>

  <div class="scroll-space"></div>

  <script>
    const about = document.getElementById("about");

    const parts = {
      leftLeg: document.getElementById("leftLeg"),
      rightLeg: document.getElementById("rightLeg"),
      body: document.getElementById("bodyLine"),
      leftArm: document.getElementById("leftArm"),
      rightArm: document.getElementById("rightArm"),
      head: document.getElementById("head")
    };

    // Prepare lines for drawing animation
    const lengths = {};

    for (const [name, element] of Object.entries(parts)) {
      const length = element.getTotalLength();
      lengths[name] = length;

      element.style.strokeDasharray = length;
      element.style.strokeDashoffset = length;
    }

    let currentProgress = 0;
    let targetProgress = 0;

    function clamp(value) {
      return Math.max(0, Math.min(1, value));
    }

    function updateScroll() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      targetProgress = maxScroll > 0
        ? clamp(window.scrollY / maxScroll)
        : 0;
    }

    // Draw part gradually between two progress points
    function drawPart(name, progress, start, end) {
      const amount = clamp(
        (progress - start) / (end - start)
      );

      parts[name].style.strokeDashoffset =
        lengths[name] * (1 - amount);
    }

    function animate() {
      currentProgress +=
        (targetProgress - currentProgress) * 0.04;

      // ABOUT ANIMATION
      const aboutProgress =
        clamp(currentProgress / 0.8);

      const startY = window.innerHeight - 45;
      const endY = 45;

      const y =
        startY + (endY - startY) * aboutProgress;

      const startX =
        window.innerWidth * 0.375 - 25;

      const endX = 45;

      const x =
        startX + (endX - startX) * aboutProgress;

      const fontSize =
        18 + 30 * aboutProgress;

      about.style.top = y + "px";
      about.style.left = x + "px";
      about.style.fontSize = fontSize + "px";

      about.style.transform =
        `translateX(${-50 * (1 - aboutProgress)}%)`;

      // FIGURE GROWTH ANIMATION
      // Begins after About reaches the top
      const growth = clamp(
        (currentProgress - 0.8) / 0.2
      );

      // 1. Legs grow upwards
      drawPart("leftLeg", growth, 0.00, 0.35);
      drawPart("rightLeg", growth, 0.00, 0.35);

      // 2. Body grows upwards
      drawPart("body", growth, 0.30, 0.65);

      // 3. Arms grow outwards
      drawPart("leftArm", growth, 0.60, 0.85);
      drawPart("rightArm", growth, 0.60, 0.85);

      // 4. Head appears last
      drawPart("head", growth, 0.80, 1.00);

      requestAnimationFrame(animate);
    }

    window.addEventListener("scroll", updateScroll);
    window.addEventListener("resize", updateScroll);

    updateScroll();
    animate();
  </script>

</body>
</html>
