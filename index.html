
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .scroll-space {
      height: 600vh;
    }

    /* About text */
    .about-button {
      position: fixed;
      top: calc(100vh - 45px);
      left: calc(37.5% - 25px);
      transform: translateX(-50%);
      background: none;
      border: none;
      padding: 0;
      color: black;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }

    /* Large figure on the left */
    .stick-figure {
      position: fixed;
      top: 25vh;
      left: 5%;
      width: 35vw;
      height: 50vh;
      pointer-events: none;
    }

    .stick-figure svg {
      width: 100%;
      height: 100%;
    }

    .figure-line,
    .head {
      fill: none;
      stroke: black;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>

<body>

  <button class="about-button" id="about">
    About
  </button>

  <div class="stick-figure">
    <svg viewBox="0 0 200 400"
         xmlns="http://www.w3.org/2000/svg">

      <!-- Legs: feet to hips -->
      <path id="leftLeg"
            class="figure-line"
            d="M40 380 L100 245"/>

      <path id="rightLeg"
            class="figure-line"
            d="M160 380 L100 245"/>

      <!-- Body: hips to neck -->
      <path id="bodyLine"
            class="figure-line"
            d="M100 245 L100 95"/>

      <!-- Arms -->
      <path id="leftArm"
            class="figure-line"
            d="M100 140 L30 220"/>

      <path id="rightArm"
            class="figure-line"
            d="M100 140 L170 220"/>

      <!-- Head -->
      <circle id="head"
              class="head"
              cx="100" cy="55" r="40"/>
    </svg>
  </div>

  <div class="scroll-space"></div>

  <script>
    const about = document.getElementById("about");

    const parts = {
      leftLeg: document.getElementById("leftLeg"),
      rightLeg: document.getElementById("rightLeg"),
      body: document.getElementById("bodyLine"),
      leftArm: document.getElementById("leftArm"),
      rightArm: document.getElementById("rightArm"),
      head: document.getElementById("head")
    };

    const lengths = {};

    // Hide all figure lines initially
    for (const [name, element] of Object.entries(parts)) {
      const length = element.getTotalLength();

      lengths[name] = length;
      element.style.strokeDasharray = length;
      element.style.strokeDashoffset = length;
    }

    let currentProgress = 0;
    let targetProgress = 0;

    let growthStarted = false;
    let growthFinished = false;
    let growthStartTime = 0;
    let growthProgress = 0;

    const growthDuration = 3000;

    function clamp(value) {
      return Math.max(0, Math.min(1, value));
    }

    function updateScroll() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      targetProgress = maxScroll > 0
        ? clamp(window.scrollY / maxScroll)
        : 0;
    }

    function drawPart(name, progress, start, end) {
      const amount = clamp(
        (progress - start) / (end - start)
      );

      parts[name].style.strokeDashoffset =
        lengths[name] * (1 - amount);
    }

    function drawFigure(progress) {
      // Legs grow first
      drawPart("leftLeg", progress, 0.00, 0.35);
      drawPart("rightLeg", progress, 0.00, 0.35);

      // Body grows upwards
      drawPart("body", progress, 0.30, 0.65);

      // Arms branch out
      drawPart("leftArm", progress, 0.60, 0.85);
      drawPart("rightArm", progress, 0.60, 0.85);

      // Head grows last
      drawPart("head", progress, 0.80, 1.00);
    }

    function animate(timestamp) {
      // Smooth About movement
      currentProgress +=
        (targetProgress - currentProgress) * 0.04;

      const aboutProgress =
        clamp(currentProgress / 0.8);

      // About moves bottom to top
      const startY = window.innerHeight - 45;
      const endY = 45;

      const y =
        startY + (endY - startY) * aboutProgress;

      // About moves towards left
      const startX =
        window.innerWidth * 0.375 - 25;

      const endX = 45;

      const x =
        startX + (endX - startX) * aboutProgress;

      // About grows from 18px to 48px
      const fontSize =
        18 + 30 * aboutProgress;

      about.style.top = y + "px";
      about.style.left = x + "px";
      about.style.fontSize = fontSize + "px";

      about.style.transform =
        `translateX(${-50 * (1 - aboutProgress)}%)`;

      // Start automatic growth when About reaches top
      if (
        aboutProgress >= 0.999 &&
        !growthStarted &&
        !growthFinished
      ) {
        growthStarted = true;
        growthStartTime = timestamp;
      }

      // Animate growth automatically over 3 seconds
      if (growthStarted && !growthFinished) {
        const elapsed = timestamp - growthStartTime;

        growthProgress = clamp(
          elapsed / growthDuration
        );

        drawFigure(growthProgress);

        if (growthProgress >= 1) {
          growthFinished = true;
          growthStarted = false;
        }
      }

      // Reset when scrolling back to beginning
      if (targetProgress < 0.05) {
        growthStarted = false;
        growthFinished = false;
        growthProgress = 0;
        drawFigure(0);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("scroll", updateScroll);
    window.addEventListener("resize", updateScroll);

    updateScroll();
    requestAnimationFrame(animate);
  </script>

</body>
</html>
