
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    .scroll-space {
      height: 500vh;
    }

    .about-button {
      position: fixed;
      top: calc(100vh - 45px);
      left: calc(37.5% - 25px);
      transform: translateX(-50%);
      background: none;
      border: none;
      padding: 0;
      color: black;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }

    /* Stick figure container */
    .stick-figure {
      position: fixed;
      top: 125px;
      left: 70px;
      width: 100px;
      height: 160px;
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.8s ease,
                  transform 0.8s ease;
      pointer-events: none;
    }

    .stick-figure.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stick-figure svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Walking movement */
    .arm-left {
      transform-origin: 50px 65px;
      animation: leftArm 1s ease-in-out infinite alternate;
    }

    .arm-right {
      transform-origin: 50px 65px;
      animation: rightArm 1s ease-in-out infinite alternate;
    }

    .leg-left {
      transform-origin: 50px 100px;
      animation: leftLeg 1s ease-in-out infinite alternate;
    }

    .leg-right {
      transform-origin: 50px 100px;
      animation: rightLeg 1s ease-in-out infinite alternate;
    }

    @keyframes leftArm {
      from { transform: rotate(-25deg); }
      to   { transform: rotate(25deg); }
    }

    @keyframes rightArm {
      from { transform: rotate(25deg); }
      to   { transform: rotate(-25deg); }
    }

    @keyframes leftLeg {
      from { transform: rotate(20deg); }
      to   { transform: rotate(-20deg); }
    }

    @keyframes rightLeg {
      from { transform: rotate(-20deg); }
      to   { transform: rotate(20deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .arm-left, .arm-right,
      .leg-left, .leg-right {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <button class="about-button" id="about">
    About
  </button>

  <!-- Animated stick figure -->
  <div class="stick-figure" id="stickFigure">
    <svg viewBox="0 0 100 160"
         xmlns="http://www.w3.org/2000/svg">

      <!-- Head -->
      <circle cx="50" cy="25" r="16"
              fill="none"
              stroke="black"
              stroke-width="3"/>

      <!-- Body -->
      <line x1="50" y1="41"
            x2="50" y2="100"
            stroke="black"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Left arm -->
      <line class="arm-left"
            x1="50" y1="65"
            x2="25" y2="90"
            stroke="black"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Right arm -->
      <line class="arm-right"
            x1="50" y1="65"
            x2="75" y2="90"
            stroke="black"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Left leg -->
      <line class="leg-left"
            x1="50" y1="100"
            x2="30" y2="145"
            stroke="black"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Right leg -->
      <line class="leg-right"
            x1="50" y1="100"
            x2="70" y2="145"
            stroke="black"
            stroke-width="3"
            stroke-linecap="round"/>

    </svg>
  </div>

  <div class="scroll-space"></div>

  <script>
    const about = document.getElementById("about");
    const stickFigure =
      document.getElementById("stickFigure");

    let currentProgress = 0;
    let targetProgress = 0;

    function updateScroll() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      targetProgress = maxScroll > 0
        ? Math.min(window.scrollY / maxScroll, 1)
        : 0;
    }

    function animate() {
      currentProgress +=
        (targetProgress - currentProgress) * 0.04;

      // About moves bottom to top
      const startY = window.innerHeight - 45;
      const endY = 45;

      const y =
        startY + (endY - startY) * currentProgress;

      // About moves toward far left
      const startX =
        window.innerWidth * 0.375 - 25;

      const endX = 45;

      const x =
        startX + (endX - startX) * currentProgress;

      // Text grows gradually
      const fontSize =
        18 + 30 * currentProgress;

      about.style.top = y + "px";
      about.style.left = x + "px";
      about.style.fontSize = fontSize + "px";

      about.style.transform =
        `translateX(${-50 * (1 - currentProgress)}%)`;

      // Show figure near the end of scrolling
      if (currentProgress > 0.97) {
        stickFigure.classList.add("visible");
      } else {
        stickFigure.classList.remove("visible");
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("scroll", updateScroll);
    window.addEventListener("resize", updateScroll);

    updateScroll();
    animate();
  </script>

</body>
</html>
