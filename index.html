
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Man Popup</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    /* Longer page for slower scrolling */
    .scroll-space {
      height: 500vh;
    }

    .about-button {
      position: fixed;
      top: calc(100vh - 45px);
      left: calc(37.5% - 25px);
      transform: translateX(-50%);

      background: none;
      border: none;
      padding: 0;

      color: black;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;

      will-change: top, left, font-size;
    }
  </style>
</head>

<body>

  <button class="about-button" id="about">
    About
  </button>

  <div class="scroll-space"></div>

  <script>
    const about = document.getElementById("about");

    let currentProgress = 0;
    let targetProgress = 0;

    function updateScroll() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      targetProgress = maxScroll > 0
        ? Math.min(window.scrollY / maxScroll, 1)
        : 0;
    }

    function animate() {
      // Smooth movement
      currentProgress +=
        (targetProgress - currentProgress) * 0.04;

      // Vertical movement
      const startY = window.innerHeight - 45;
      const endY = 45;

      const y =
        startY + (endY - startY) * currentProgress;

      // Horizontal movement
      const startX =
        window.innerWidth * 0.375 - 25;

      const endX = 45;

      const x =
        startX + (endX - startX) * currentProgress;

      // Gradual size increase
      const fontSize =
        18 + (48 - 18) * currentProgress;

      about.style.top = y + "px";
      about.style.left = x + "px";
      about.style.fontSize = fontSize + "px";

      about.style.transform =
        `translateX(${-50 * (1 - currentProgress)}%)`;

      requestAnimationFrame(animate);
    }

    window.addEventListener("scroll", updateScroll);
    window.addEventListener("resize", updateScroll);

    updateScroll();
    animate();
  </script>

</body>
</html>
