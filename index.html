
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: white;
      font-family: Arial, sans-serif;
    }

    .about-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: white;
      color: black;
      border: 1px solid black;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .about-button:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>
  <button class="about-button">About</button>
</body>
</html>
