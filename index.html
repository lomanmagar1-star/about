
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Man Popup</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    .scroll-space {
      height: 500vh;
    }

    /* About text */
    .about-button {
      position: fixed;
      top: calc(100vh - 45px);
      left: calc(37.5% - 25px);
      transform: translateX(-50%);
      background: none;
      border: none;
      padding: 0;
      color: black;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }

    /* Large stick figure on the left */
    .stick-figure {
      position: fixed;
      top: 25vh;
      left: 5%;

      width: 35vw;
      height: 50vh;

      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .stick-figure.visible {
      opacity: 1;
    }

    .stick-figure svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <button class="about-button" id="about">
    About
  </button>

  <!-- Large stationary stick figure -->
  <div class="stick-figure" id="stickFigure">
    <svg viewBox="0 0 200 400"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet">

      <!-- Head -->
      <circle cx="100" cy="55" r="40"
              fill="none"
              stroke="black"
              stroke-width="5"/>

      <!-- Body -->
      <line x1="100" y1="95"
            x2="100" y2="245"
            stroke="black"
            stroke-width="5"
            stroke-linecap="round"/>

      <!-- Left arm -->
      <line x1="100" y1="140"
            x2="30" y2="220"
            stroke="black"
            stroke-width="5"
            stroke-linecap="round"/>

      <!-- Right arm -->
      <line x1="100" y1="140"
            x2="170" y2="220"
            stroke="black"
            stroke-width="5"
            stroke-linecap="round"/>

      <!-- Left leg -->
      <line x1="100" y1="245"
            x2="40" y2="380"
            stroke="black"
            stroke-width="5"
            stroke-linecap="round"/>

      <!-- Right leg -->
      <line x1="100" y1="245"
            x2="160" y2="380"
            stroke="black"
            stroke-width="5"
            stroke-linecap="round"/>
    </svg>
  </div>

  <div class="scroll-space"></div>

  <script>
    const about = document.getElementById("about");
    const stickFigure =
      document.getElementById("stickFigure");

    let currentProgress = 0;
    let targetProgress = 0;

    function updateScroll() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      targetProgress = maxScroll > 0
        ? Math.min(window.scrollY / maxScroll, 1)
        : 0;
    }

    function animate() {
      currentProgress +=
        (targetProgress - currentProgress) * 0.04;

      // Vertical movement
      const startY = window.innerHeight - 45;
      const endY = 45;

      const y =
        startY + (endY - startY) * currentProgress;

      // Horizontal movement
      const startX =
        window.innerWidth * 0.375 - 25;
      const endX = 45;

      const x =
        startX + (endX - startX) * currentProgress;

      // Font size increase
      const fontSize =
        18 + 30 * currentProgress;

      about.style.top = y + "px";
      about.style.left = x + "px";
      about.style.fontSize = fontSize + "px";

      about.style.transform =
        `translateX(${-50 * (1 - currentProgress)}%)`;

      // Show stick figure near the top
      if (currentProgress > 0.97) {
        stickFigure.classList.add("visible");
      } else {
        stickFigure.classList.remove("visible");
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("scroll", updateScroll);
    window.addEventListener("resize", updateScroll);

    updateScroll();
    animate();
  </script>

</body>
</html>
